{% extends "base.html" %}
{% block title %}Ajouter un dessin{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-3xl shadow-sm border border-gray-100 p-8">
    <h1 class="font-fun text-3xl font-bold text-indigo-700 mb-6 text-center">Ajouter un dessin</h1>
    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}<p class="text-xs text-red-600 mt-1">{{ error }}</p>{% endfor %}
            </div>
        {% endfor %}
        <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold shadow">
            Ajouter à la galerie
        </button>
    </form>
    <a href="{% url 'gallery:dashboard_parent' %}" class="block text-center text-sm text-gray-500 mt-6 hover:underline">← Retour au tableau de bord</a>
</div>
{% endblock %}
